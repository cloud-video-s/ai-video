timezone: Asia/Shanghai

server:
  port: 8080
  mode: release # debug | release | test

database:
  driver: mysql
  host: localhost
  port: 3308
  username: root
  password: "cloud_123456"
  dbname: app
  charset: utf8mb4
  max_idle_conns: 10
  max_open_conns: 100
  log_level: info # silent | error | warn | info

redis:
  host: localhost
  port: 6380
  password: ""
  db: 0
  key_prefix: "video:"

jwt:
  secret: video-jwt-secret-key-change-in-production
  expire: 7200
  issuer: admin_video

api_jwt:
  secret: video-jwt-api-in-production-app
  expire: 604800
  issuer: api_video

geoip:
  country_header: ""
  lookup_url: ""
  country_field: country_code
  timeout_ms: 3000

third_party_auth:
  http_timeout_ms: 5000
  jwks_cache_seconds: 21600
  google:
    client_ids: []
    issuers: [https://accounts.google.com, accounts.google.com]
    jwks_url: https://www.googleapis.com/oauth2/v3/certs
  apple:
    client_ids: []
    issuers: [https://appleid.apple.com]
    jwks_url: https://appleid.apple.com/auth/keys

# enabled controls inbound attribution callbacks; event_enabled independently
# controls outbound S2S events. callback_token is an application-defined shared
# secret and has no Adjust-defined minimum length. event_auth_token is required
# only when S2S Security is enabled in Adjust. event_app_tokens is a fallback
# keyed by the internal app_code when attribution did not carry app_token.
adjust:
  enabled: true
  event_enabled: true
  callback_token: "skhu8wqoy3gg"
  max_body_bytes: 65536
  tracker_channels: {}
  event_auth_token: "skhu8wqoy3gg"
  event_base_url: https://s2s.adjust.com
  event_environment: production # production | sandbox
  event_app_tokens: {}

app_store:
  bundle_id: ""
  issuer_id: ""
  key_id: ""
  private_key_path: config/appkey.p8
  http_timeout_ms: 10000

upload:
  root_dir: storage/uploads/tmp
  local_root_dir: storage/uploads/files
  local_base_url: /uploads
  storage_provider: local # local | aliyun_oss
  oss_region: ""
  oss_endpoint: ""
  oss_access_key_id: ""
  oss_access_key_secret: ""
  oss_bucket: ""
  oss_object_prefix: uploads
  oss_base_url: ""
  proxy_base_url: ""
  oss_signature_ttl_seconds: 600
  chunk_size: 5242880
  max_batch_files: 20
  session_ttl_seconds: 86400
  image_max_file_size: 20971520
  video_max_file_size: 2147483648
  image_extensions: [.jpg, .jpeg, .png, .gif, .webp]
  video_extensions: [.mp4, .mov, .webm, .mkv]
  image_mime_types: [image/jpeg, image/png, image/gif, image/webp]
  video_mime_types: [video/mp4, video/quicktime, video/webm, video/x-matroska]

casbin:
  model_path: config/rbac_model.conf

task:
  concurrency: 10
  download_concurrency: 1
  download_retry_count: 3
  worker_restart_delay_seconds: 1
  worker_restart_max_delay_seconds: 30
  subscription_expiration_at: ""
  queues:
    - critical
    - default
    - low

log:
  level: info
  format: console
  directory: logs
  max_size: 100
  max_backups: 10
  max_age: 30
